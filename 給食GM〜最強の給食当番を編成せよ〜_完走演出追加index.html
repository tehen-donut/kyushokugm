  <script>
    class SoundFX {
      constructor() { this.ctx = null; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      playSelect() {
        this.init(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.08);
      }
      playGrowth() {
        this.init(); const now = this.ctx.currentTime;
        [440, 554.37, 659.25, 880].forEach((freq, i) => {
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.08, now + i * 0.06); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.18);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.18);
        });
      }
      playSuccess() {
        this.init(); [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime + idx * 0.07); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.07 + 0.2);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(this.ctx.currentTime + idx * 0.07); osc.stop(this.ctx.currentTime + idx * 0.07 + 0.2);
        });
      }
      playAlert() {
        this.init(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, this.ctx.currentTime); osc.frequency.setValueAtTime(190, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);
        osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.28);
      }
      playFanfare() {
        this.init(); const now = this.ctx.currentTime;
        [{f:523.25,t:0},{f:523.25,t:0.12},{f:523.25,t:0.24},{f:659.25,t:0.36},{f:783.99,t:0.55}].forEach(n => {
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.frequency.value = n.f;
          gain.gain.setValueAtTime(0.1, now + n.t); gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + 0.25);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now + n.t); osc.stop(now + n.t + 0.25);
        });
      }
    }
    const sfx = new SoundFX();
  </script>

      { id: 12, name: "ひなの", icon: "🐥", speed: 18, neat: 36, hygiene: 38, team: 35, potential: "A", prefWeeks: 3, cost: 3, generosity: 0.42, scoutDiscount: 1, reqText: "3週間契約：デザート全確保", desc: "おっとり癒やし系。長期契約を通じて着実にチームを底上げする。" }
    ];

    const MENU_SCHEDULE = [
      { day: "月曜日", primary: "ごはん", side1: "サラダ", side2: "唐揚げ", soup: "みそ汁", codes: { primary: "A", side1: "C", side2: "B", soup: "D" }, menu: "ごはん・サラダ・唐揚げ・みそ汁", note: "A：主食は手際を重視。唐揚げは手際・丁寧さを軽視し、みそ汁は丁寧さを重視。" },
      { day: "火曜日", primary: "パン", side1: "ハンバーグ", side2: "フルーツ", soup: "スープ", codes: { primary: "B", side1: "B", side2: "B", soup: "D" }, menu: "パン・ハンバーグ・フルーツ・スープ", note: "パン・ハンバーグ・フルーツは手際と丁寧さを軽視。スープは丁寧さを重視。" },
      { day: "水曜日", primary: "ごはん", side1: "福神漬け", side2: "ヨーグルト", soup: "カレー", codes: { primary: "A", side1: "C", side2: "B", soup: "D" }, menu: "ごはん・福神漬け・ヨーグルト・カレー", note: "ごはんは手際を重視。福神漬けは通常評価、ヨーグルトは手際・丁寧さを軽視、カレーは丁寧さを重視。" },
      { day: "木曜日", primary: "ごはん", side1: "ひじき", side2: "さば", soup: "豚汁", codes: { primary: "A", side1: "C", side2: "B", soup: "D" }, menu: "ごはん・ひじき・さば・豚汁", note: "ごはんは手際を重視。ひじきは通常評価、さばは手際・丁寧さを軽視、豚汁は丁寧さを重視。" },
      { day: "金曜日", primary: "ソフトめん", side1: "ミートソース", side2: "ゼリー", soup: "スープ", codes: { primary: "C", side1: "C", side2: "B", soup: "D" }, menu: "ソフトめん・ミートソース・ゼリー・スープ", note: "ソフトめんとミートソースは通常評価、ゼリーは手際・丁寧さを軽視、スープは丁寧さを重視。" }
    ];

    // A〜Dは各担当の手際・丁寧さの評価感度を表す。衛生の重要度は全担当で共通。
    const MENU_CODE_FACTORS = {
      A: { speed: 1.4, neat: 1.0 },  // 手際を重視
      B: { speed: 0.6, neat: 0.6 },  // 手際・丁寧さを軽視

    function adjustMenuSensitiveStat(value, factor) {
      // 50点を基準に、低い能力のマイナス影響だけを重要度に応じて増減させる。
      // 能力が50以上なら通常どおり反映する。
      return value < 50 ? 50 + (value - 50) * factor : value;
    }

    const COMBOS = [
      { p1: 1, p2: 7, name: "⚡ 爆走スピード狂", effect: "手際+25 / 丁寧さ-15", speed: 25, neat: -15, hygiene: 0, team: 0 },
      { p1: 2, p2: 6, name: "✨ クリーンガールズ", effect: "丁寧さ+20 / 衛生+20", speed: -5, neat: 20, hygiene: 20, team: 10 },
      { p1: 5, p2: 10, name: "🛡️ 鉄壁の衛生委員会", effect: "衛生+30 / トラブル軽減", speed: 0, neat: 10, hygiene: 30, team: 15 },
      { p1: 3, p2: 11, name: "🗣️ わんぱくコンビ", effect: "協調性+20 / トラブル微増", speed: 10, neat: -10, hygiene: -10, team: 20, troubleRate: 0.12 }
    ];

    const AUTO_TROUBLES = [
      { title: "汁物豪快こぼし事故！", penalty: -15, desc: "当番が床に汁物をぶちまけてしまい、配膳が大幅に遅れました。" },
      { title: "おかず盛り付け偏り惨事！", penalty: -12, desc: "前半に盛りすぎた結果、後半の生徒のおかずが極小になりました。" },

    // セーブコードはゲーム状態をJSON化してBase64に変換する。外部サーバーは使用しない。
    const SAVE_CODE_PREFIX = "KYUSHOKU_SAVE_V1:";
    function encodeSavePayload(payload) {
      const bytes = new TextEncoder().encode(JSON.stringify(payload));
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }
    function decodeSavePayload(raw) {
      // スマホでの貼り付け時に混ざる空白・引用符・改行を除去し、複数世代のコード形式を読む。
      let text = String(raw || "").trim();
      if (!text) throw new Error("empty");
      text = text.replace(/^[\s\u200B-\u200D\uFEFF]+|[\s\u200B-\u200D\uFEFF]+$/g, "");
      // コード全体を引用符で囲んで貼り付けた場合にも対応。
      if ((text.startsWith('"') && text.endsWith('"')) || (text.startsWith("'") && text.endsWith("'"))) text = text.slice(1, -1);
      text = text.replace(/[\s\u200B-\u200D\uFEFF]/g, "");
      if (text.startsWith(SAVE_CODE_PREFIX)) text = text.slice(SAVE_CODE_PREFIX.length);
      // Base64URL と通常の Base64 の両方に対応。
      text = text.replace(/-/g, "+").replace(/_/g, "/");
      if (!/^[A-Za-z0-9+/]*={0,2}$/.test(text)) throw new Error("base64-characters");
      text = text.replace(/=+$/, "");
      while (text.length % 4) text += "=";
      const binary = atob(text);
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      const json = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      return JSON.parse(json);
    }
    function saveGameCode() {
      try {
        const payload = { version: 1, gameState: JSON.parse(JSON.stringify(gameState)) };
        const code = SAVE_CODE_PREFIX + encodeSavePayload(payload);
        // promptは長いセーブコードをコピーしづらいため、選択しやすい入力欄を表示する。
        const area = document.createElement("textarea");
        area.value = code; area.readOnly = true;
        area.style.cssText = "position:fixed;inset:12% 5%;width:90%;height:65%;z-index:99999;background:#fff;color:#111;border:3px solid #0f766e;border-radius:12px;padding:12px;font:12px monospace;user-select:text;";
        area.setAttribute("aria-label", "セーブコード");
        const close = document.createElement("button"); close.textContent = "閉じる";
        close.style.cssText = "position:fixed;top:80%;left:35%;width:30%;z-index:100000;padding:12px;background:#0f766e;color:white;border-radius:8px;font-weight:bold;";
        close.onclick = () => { area.remove(); close.remove(); };
        document.body.append(area, close); area.focus(); area.select();
        try { document.execCommand("copy"); } catch (_) {}
        window.alert("セーブコードを表示しました。自動コピーできていない場合は、コード欄を長押しして「すべて選択」→「コピー」してください。コードは最後まで保存してください。");
      } catch (e) {
        window.alert("セーブコードを作成できませんでした。ページを再読み込みして、もう一度お試しください。");
      }
    }

      const panel = document.createElement("div");
      panel.style.cssText = "width:min(720px,100%);max-height:95%;overflow:auto;background:#fff;color:#17202a;border-radius:14px;padding:16px;box-sizing:border-box;box-shadow:0 10px 40px rgba(0,0,0,.35);";
      const heading = document.createElement("h2");
      heading.textContent = "セーブデータをロード";
      heading.style.cssText = "margin:0 0 8px;font-size:20px;";
      const help = document.createElement("p");

    function loadGameCodeFromText(code) {
      if (!code || !String(code).trim()) throw new Error("コードが入力されていません");
      const payload = decodeSavePayload(code);
      const rawSaved = payload && payload.gameState ? payload.gameState : (payload && payload.state ? payload.state : (payload && payload.saveData ? payload.saveData : payload));
      const saved = rawSaved && typeof rawSaved === "object" ? { ...rawSaved } : rawSaved;
      if (saved && !Array.isArray(saved.students)) {
        if (Array.isArray(saved.studentList)) saved.students = saved.studentList;
        else if (Array.isArray(saved.roster)) saved.students = saved.roster;
      }
      if (!saved || typeof saved !== "object" || !Array.isArray(saved.students)) throw new Error("データ内に生徒一覧がありません（別形式のコードの可能性があります）");
      if (!Array.isArray(saved.activeContracts)) saved.activeContracts = [];
      if (!saved.dailyDuty || typeof saved.dailyDuty !== "object") saved.dailyDuty = { primary: null, side1: null, side2: null, soup: null };
      if (typeof saved.week !== "number" || !Number.isFinite(saved.week)) saved.week = 1;
      saved.week = Math.max(1, Math.min(42, Math.floor(saved.week)));
      if (typeof saved.dayIndex !== "number" || !Number.isFinite(saved.dayIndex)) saved.dayIndex = 0;
      saved.dayIndex = Math.max(0, Math.min(MENU_SCHEDULE.length - 1, Math.floor(saved.dayIndex)));
      if (typeof saved.tickets !== "number" || !Number.isFinite(saved.tickets)) saved.tickets = 0;
      if (typeof saved.classSatisfaction !== "number" || !Number.isFinite(saved.classSatisfaction)) saved.classSatisfaction = 100;
      if (typeof saved.gameOverReason !== "string") saved.gameOverReason = "";
      if (!Array.isArray(saved.weekLog)) saved.weekLog = [];
      if (!Array.isArray(saved.yearScores)) saved.yearScores = [];
      if (!saved.yearDutyCounts || typeof saved.yearDutyCounts !== "object") saved.yearDutyCounts = {};
      if (!Array.isArray(saved.breakGrowthLogs)) saved.breakGrowthLogs = [];
      if (!Array.isArray(saved.visitingStudentsQueue)) saved.visitingStudentsQueue = [];
      if (!saved.scoutCooldowns || typeof saved.scoutCooldowns !== "object") saved.scoutCooldowns = {};
      if (!saved.dailyDuty.primary && !saved.dailyDuty.side1 && !saved.dailyDuty.side2 && !saved.dailyDuty.soup) {
        saved.dailyDuty = { primary: null, side1: null, side2: null, soup: null };
      }
      const validPhases = ["TITLE", "INTRO", "SCOUT", "DAILY_ASSIGN", "SIMULATION", "DAY_RESULT", "RENEWAL_VISIT", "WEEK_RESULT", "GAME_OVER", "BREAK_RESULT", "FAREWELL", "YEAR_END"];
      if (!validPhases.includes(saved.phase)) saved.phase = saved.students.length ? "SCOUT" : "TITLE";
      gameState = saved;
      if (gameState.phase === "SIMULATION") gameState.phase = gameState.currentSimResult ? "DAY_RESULT" : "DAILY_ASSIGN";
      render();
      window.alert("ロードしました！");
    }

    function initGame() {
      gameState.students = JSON.parse(JSON.stringify(INITIAL_STUDENTS_MASTER));
      gameState.students.forEach(s => { s.fatigue = 0; });
      gameState.week = 1; gameState.dayIndex = 0; gameState.tickets = 8; gameState.gameOverReason = "";
      gameState.classSatisfaction = 100; gameState.activeContracts = []; gameState.weekLog = [];
      gameState.lastGrowthLogs = []; gameState.visitingStudentsQueue = [];
      gameState.yearScores = []; gameState.yearDutyCounts = {}; gameState.breakGrowthLogs = []; gameState.breakType = "";
      gameState.totalDays = 0; gameState.scoutCooldowns = {};
      gameState.currentVisitingStudent = null; gameState.currentRenewalOffer = null;
      gameState.dailyDuty = { primary: null, side1: null, side2: null, soup: null };
      addContract(1, 1, 0); addContract(2, 1, 0);
      gameState.dailyDuty.primary = 1; gameState.dailyDuty.side1 = 2;
      gameState.phase = "INTRO"; render();
    }

    function addContract(studentId, weeks, cost) {
      gameState.activeContracts.push({ studentId, weeksTotal: weeks, daysRemaining: weeks * 5, costPaid: cost, troubleCount: 0 });
    }

    function removeContract(studentId) {
      gameState.activeContracts = gameState.activeContracts.filter(c => c.studentId !== studentId);
      for (let role in gameState.dailyDuty) if (gameState.dailyDuty[role] === studentId) gameState.dailyDuty[role] = null;
    }

    function sanitizeDutyAssignments() {
      const activeIds = gameState.activeContracts.map(c => c.studentId);
      for (let role in gameState.dailyDuty) {
        if (gameState.dailyDuty[role] && !activeIds.includes(gameState.dailyDuty[role])) gameState.dailyDuty[role] = null;
      }
    }

    function getContract(studentId) { return gameState.activeContracts.find(c => c.studentId === studentId); }
    // 契約終了・戦力外から5日間（給食当番の5日分）は再スカウト不可。
    function getScoutCooldownDays(studentId) {
      return Math.max(0, (gameState.scoutCooldowns[studentId] || 0) - gameState.totalDays);
    }
    function putStudentOnScoutCooldown(studentId) {
      gameState.scoutCooldowns[studentId] = gameState.totalDays + 5;
    }
    function getStudent(studentId) { return gameState.students.find(s => s.id === Number(studentId)); }
    function getActiveCombos(studentIds) { return COMBOS.filter(c => studentIds.includes(c.p1) && studentIds.includes(c.p2)); }

    // 能力4項目の平均を基に基本契約料を算出する。育成で能力が上がるほど価格も上がる。
    function getAverageAbility(student) {
      return (student.speed + student.neat + student.hygiene + student.team) / 4;
    }

    function getBaseContractPrice(student) {
      return Math.max(1, Math.round((student.cost * 0.5) + (getAverageAbility(student) / 12)));
    }

    function getScoutContractPrice(student) {
      return Math.max(1, getBaseContractPrice(student) - (student.scoutDiscount || 0));
    }

    // 疲労が高い生徒は更新時に大幅な上乗せ要求をすることがある。
    function getFatigueSurcharge(fatigue) {
      if (fatigue >= 95) return 20;
      if (fatigue >= 90) return 18;
      if (fatigue >= 75) return 13;
      if (fatigue >= 60) return 9;
      if (fatigue >= 45) return 6;
      if (fatigue >= 30) return 3;
      if (fatigue >= 15) return 1;
      return 0;
    }

    function createRenewalOffer(student) {
      const basePrice = getBaseContractPrice(student);
      const fatigue = student.fatigue || 0;

      // 一部の生徒は能力や疲労にかかわらず、善意で値引きしてくれる。
      if (Math.random() < (student.generosity || 0)) {
        const extraDiscount = Math.random() < 0.45 ? 1 : 0;
        const discount = (student.scoutDiscount || 0) + 1 + extraDiscount;
        return {
          cost: Math.max(1, basePrice - discount),
          generous: true,
          fatigueSurcharge: 0
        };
      }

      const roll = Math.random();
      const ordinaryPremium = roll < 0.40 ? 0 : roll < 0.70 ? 1 : roll < 0.90 ? 2 : 4;
      const fatigueSurcharge = getFatigueSurcharge(fatigue);
      return {
        cost: basePrice + ordinaryPremium + fatigueSurcharge,
        generous: false,
        fatigueSurcharge
      };
    }

    // 当番をした生徒は疲労+12。休んだ生徒は契約の有無にかかわらず疲労-30。
    function processStudentFatigue(assignedStudentIds) {
      const workedIds = new Set(assignedStudentIds.filter(id => id !== null && id !== undefined));
      gameState.students.forEach(student => {
        if (workedIds.has(student.id)) student.fatigue = Math.min(100, (student.fatigue || 0) + 12);
        else student.fatigue = Math.max(0, (student.fatigue || 0) - 30);
      });
    }

    function processStudentGrowth(assignedStudentIds) {
      const growthLogs = [];
      [...new Set(assignedStudentIds.filter(id => id !== null && id !== undefined))].forEach(id => {
        const student = getStudent(id); if (!student) return;
        const potConfig = POTENTIAL_CONFIG[student.potential];
        if (Math.random() < potConfig.chance) {
          const stats = ["speed", "neat", "hygiene", "team"];
          const targetStat = stats[Math.floor(Math.random() * stats.length)];
          if (student[targetStat] < potConfig.maxStat) {
            const growAmount = Math.floor(Math.random() * (potConfig.growMax - potConfig.growMin + 1)) + potConfig.growMin;
            student[targetStat] = Math.min(potConfig.maxStat, student[targetStat] + growAmount);
            const statNameMap = { speed: "手際", neat: "丁寧さ", hygiene: "衛生", team: "協調性" };
            growthLogs.push(`⚡ ${student.name} の【${statNameMap[targetStat]}】が +${growAmount} 成長した！ (${student[targetStat]}/${potConfig.maxStat})`);
          }
        }
      });
      return growthLogs;
    }

    // 4人未満で、残チケットでは4人に戻せない場合はゲームオーバー。
    function hasEnoughTicketsToReachFour() {
      const needed = 4 - gameState.activeContracts.length;
      if (needed <= 0) return true;
      const contractedIds = new Set(gameState.activeContracts.map(c => c.studentId));
      const affordableCandidates = gameState.students
        .filter(student => !contractedIds.has(student.id) && getScoutCooldownDays(student.id) === 0)
        .map(student => getScoutContractPrice(student))
        .sort((a, b) => a - b);
      if (affordableCandidates.length < needed) return false;
      const minimumCost = affordableCandidates.slice(0, needed).reduce((sum, cost) => sum + cost, 0);
      return gameState.tickets >= minimumCost;
    }

    function checkForGameOver() {
      // タイトル画面・説明画面はまだプレイ開始前なので、契約人数による判定をしない。
      if (gameState.phase === "TITLE" || gameState.phase === "INTRO") return false;
      if (gameState.phase === "GAME_OVER") return true;
      if (gameState.phase === "YEAR_END" || gameState.phase === "BREAK_RESULT") return false;
      // 契約更改の面談が残っている間は、後続の更新で4人以上に戻れる可能性があるため判定を待つ。
      if (gameState.phase === "RENEWAL_VISIT") return false;
      if (gameState.activeContracts.length < 4 && !hasEnoughTicketsToReachFour()) {
        gameState.gameOverReason = `契約中の生徒が${gameState.activeContracts.length}人しかおらず、所持チケット（${gameState.tickets}枚）では4人以上に戻せません。`;
        gameState.phase = "GAME_OVER";
        return true;
      }
      return false;
    }

    function renderGameOverPhase(container) {

    }

        html += `

              ` : `
                ${cooldownDays > 0 ? `<div class="text-center text-[11px] font-bold text-rose-700 bg-rose-100 rounded p-1 mb-1">契約終了後の再スカウト制限：あと${cooldownDays}日</div>` : ''}
                <button onclick="scoutStudent(${s.id})" ${(!canAfford || limitReached || cooldownDays > 0) ? 'disabled' : ''} class="w-full py-1.5 ${(!canAfford || limitReached || cooldownDays > 0) ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-md'} font-black rounded text-xs transition">
                  ${limitReached ? '契約枠上限(6人)' : cooldownDays > 0 ? `再スカウトまであと${cooldownDays}日` : (!canAfford ? `チケット不足 (🎟️${quoteCost})` : `契約を交わす (🎟️${quoteCost}要 / ${s.prefWeeks}週間)`)}
                </button>
              `}
            </div>
          </div>
        `;
      });
      html += `</div></div>`;
      container.innerHTML = html;
    }

    function scoutStudent(id) {
      const student = getStudent(id); if (!student) return;
      if (gameState.activeContracts.length >= 6) { alert("契約人数が上限（6名）に達しています！"); return; }
      if (getScoutCooldownDays(id) > 0) { alert(`契約終了後の再スカウト制限中です。あと${getScoutCooldownDays(id)}日お待ちください。`); return; }
      const cost = getScoutContractPrice(student);
      if (gameState.tickets < cost) { sfx.playAlert(); return; }
      sfx.playSuccess(); gameState.tickets -= cost; addContract(student.id, student.prefWeeks, cost); render();
    }

    function terminateContractMidway(id) {
      const student = getStudent(id);
      if (confirm(`${student.name}との契約を解除しますか？（消費したチケットは戻りません）`)) {
        sfx.playSelect(); putStudentOnScoutCooldown(id); removeContract(id); render();
      }
    }

    function renderDailyAssignPhase(container) {
      const todayMenu = MENU_SCHEDULE[gameState.dayIndex];
      const contractedStudents = gameState.activeContracts.map(c => getStudent(c.studentId)).filter(Boolean);
      const assignedIds = [gameState.dailyDuty.primary, gameState.dailyDuty.side1, gameState.dailyDuty.side2, gameState.dailyDuty.soup].filter(Boolean);
      const activeCombos = getActiveCombos(assignedIds);
      let html = `
        <div class="space-y-3">
          <div class="bg-amber-100 border-l-8 border-amber-600 text-amber-950 p-3 rounded-lg shadow flex flex-wrap justify-between items-center gap-2">
            <div><div class="flex items-center gap-2"><span class="text-xs bg-amber-700 text-white px-2 py-0.5 rounded font-bold">${todayMenu.day}の給食</span><h3 class="text-base sm:text-lg font-black">${todayMenu.menu}</h3></div></div>
            <button onclick="switchPhase('SCOUT')" class="px-3.5 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-extrabold rounded-lg shadow transition flex items-center gap-1"><span>🔍</span> 新規スカウト (${contractedStudents.length}/6人)</button>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            ${renderDutySlot("🍚 主食担当 (1名)", "primary", gameState.dailyDuty.primary, todayMenu.primary, "badge-primary")}
            ${renderDutySlot("🥗 おかず担当①", "side1", gameState.dailyDuty.side1, todayMenu.side1, "badge-side")}
            ${renderDutySlot("🥗 おかず担当②", "side2", gameState.dailyDuty.side2, todayMenu.side2, "badge-side")}
            ${renderDutySlot("🍲 汁物担当 (1名)", "soup", gameState.dailyDuty.soup, todayMenu.soup, "badge-soup")}
          </div>
          ${activeCombos.length > 0 ? `<div class="bg-indigo-950/90 border border-indigo-500 p-2 rounded-lg text-xs text-indigo-200 flex items-center gap-2 shadow"><span class="text-base">✨</span><div><strong class="text-amber-300 font-bold">シナジー発動:</strong> ${activeCombos.map(c => `<span class="bg-indigo-900 px-2 py-0.5 rounded text-amber-200 border border-indigo-700 mr-1">${c.name}</span>`).join('')}</div></div>` : ''}
          <div class="bg-emerald-950/80 p-2.5 rounded-xl border border-emerald-700/80">
            <div class="flex justify-between items-center mb-1.5"><h4 class="text-xs font-black text-emerald-300">📋 契約中メンバー（クリックで配膳枠に自動配置）</h4><span class="text-[10px] text-emerald-400">契約数: ${contractedStudents.length} / 6人</span></div>
            ${contractedStudents.length === 0 ? `<div class="text-center py-6 text-amber-200 text-xs">契約中の生徒がいません！右上ボタンからスカウトを行ってください。</div>` : `
              <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
                ${contractedStudents.map(s => {
                  const contract = getContract(s.id); const isAssigned = assignedIds.includes(s.id); const potConfig = POTENTIAL_CONFIG[s.potential];
                  return `<div onclick="autoAssign('${s.id}')" class="notebook-card p-2 rounded text-xs transition cursor-pointer flex flex-col justify-between ${isAssigned ? 'ring-2 ring-emerald-500 opacity-50 bg-slate-200' : 'hover:scale-105'}"><div><div class="font-extrabold text-slate-800 flex justify-between items-center"><span class="truncate">${s.icon} ${s.name}</span><span class="text-[9px] px-1 rounded font-black ${potConfig.badgeClass}">${s.potential}</span></div><div class="mt-1 text-[10px] text-slate-600 leading-tight">手際:${s.speed} 丁寧:${s.neat} 衛:${s.hygiene}<br><span class="font-extrabold ${s.fatigue >= 75 ? 'text-rose-700' : s.fatigue >= 45 ? 'text-amber-700' : 'text-emerald-700'}">😮‍💨 疲労度:${s.fatigue || 0}/100</span></div></div><div class="mt-1 text-[9px] font-bold text-rose-700 border-t border-slate-300 pt-0.5">契約残り: ${contract ? contract.daysRemaining : 0}日</div></div>`;
                }).join('')}
              </div>`}
          </div>
          <div class="flex justify-between items-center pt-1"><button onclick="clearDuty()" class="text-xs text-emerald-300 hover:text-white underline">配置リセット</button><button onclick="startSimulation()" ${assignedIds.length < 4 ? 'disabled' : ''} class="px-7 py-2.5 ${assignedIds.length < 4 ? 'bg-slate-600 text-slate-400 cursor-not-allowed' : 'bg-amber-500 hover:bg-amber-400 text-slate-900 pulse-animation'} font-black rounded-xl shadow-xl transition text-sm sm:text-base">${assignedIds.length < 4 ? `あと ${4 - assignedIds.length} 人の配置が必要です` : '給食配膳スタート！ 🔔'}</button></div>
        </div>`;
      container.innerHTML = html;
    }

    function renderDutySlot(title, roleKey, assignedId, menuText, badgeClass) {
      const student = getStudent(assignedId);
      return `<div class="bg-emerald-950/80 border-2 ${student ? 'border-amber-400 bg-emerald-900/90' : 'border-dashed border-emerald-700'} rounded-xl p-2 text-center flex flex-col justify-between min-h-[120px] shadow"><div><span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded ${badgeClass}">${title}</span><div class="text-[11px] text-emerald-300 mt-0.5 font-bold truncate">${menuText}</div></div><div class="my-1">${student ? `<div class="text-xl">${student.icon}</div><div class="font-extrabold text-amber-200 text-xs">${student.name}</div>` : `<div class="text-xs text-rose-300 py-2 font-bold">【未配置】</div>`}</div>${student ? `<button onclick="unassignRole('${roleKey}')" class="text-[9px] bg-rose-800/80 hover:bg-rose-700 text-rose-100 px-1.5 py-0.5 rounded font-bold">外す</button>` : `<div class="text-[9px] text-emerald-500 font-medium">下から選択</div>`}</div>`;
    }

    function autoAssign(studentId) {
      studentId = parseInt(studentId); sfx.playSelect();
      for (let role in gameState.dailyDuty) {
        if (gameState.dailyDuty[role] === studentId) { gameState.dailyDuty[role] = null; render(); return; }
      }
      if (!gameState.dailyDuty.primary) gameState.dailyDuty.primary = studentId;
      else if (!gameState.dailyDuty.side1) gameState.dailyDuty.side1 = studentId;
      else if (!gameState.dailyDuty.side2) gameState.dailyDuty.side2 = studentId;
      else if (!gameState.dailyDuty.soup) gameState.dailyDuty.soup = studentId;
      render();
    }
    function unassignRole(roleKey) { sfx.playSelect(); gameState.dailyDuty[roleKey] = null; render(); }
    function clearDuty() { sfx.playSelect(); gameState.dailyDuty = { primary: null, side1: null, side2: null, soup: null }; render(); }
    function switchPhase(newPhase) { sfx.playSelect(); gameState.phase = newPhase; render(); }

    function startSimulation() {
      const assignedIds = [gameState.dailyDuty.primary, gameState.dailyDuty.side1, gameState.dailyDuty.side2, gameState.dailyDuty.soup];
      if (assignedIds.some(id => id === null || id === undefined) || new Set(assignedIds).size !== 4) return;
      const assignedStudents = assignedIds.map(id => getStudent(id));
      if (assignedStudents.some(s => !s)) return;
      sfx.playSuccess(); gameState.phase = "SIMULATION";
      const combos = getActiveCombos(assignedIds);
      const roleKeys = ["primary", "side1", "side2", "soup"];
      const roleCodes = roleKeys.map(role => MENU_SCHEDULE[gameState.dayIndex].codes[role]);
      let totalSpeed = assignedStudents.reduce((acc, student, i) => {
        const factor = MENU_CODE_FACTORS[roleCodes[i]]?.speed ?? 1;
        return acc + adjustMenuSensitiveStat(student.speed, factor);
      }, 0) / 4;
      let totalNeat = assignedStudents.reduce((acc, student, i) => {
        const factor = MENU_CODE_FACTORS[roleCodes[i]]?.neat ?? 1;
        return acc + adjustMenuSensitiveStat(student.neat, factor);
      }, 0) / 4;
      // 衛生と協調性は、曜日・メニュー・担当記号による重み付けを行わない。
      let totalHygiene = assignedStudents.reduce((acc, s) => acc + s.hygiene, 0) / 4;
      let totalTeam = assignedStudents.reduce((acc, s) => acc + s.team, 0) / 4;
      let extraTrouble = 0;
      combos.forEach(c => { totalSpeed += c.speed || 0; totalNeat += c.neat || 0; totalHygiene += c.hygiene || 0; totalTeam += c.team || 0; if (c.troubleRate) extraTrouble += c.troubleRate; });
      const baseTroubleChance = 0.28 + (100 - totalNeat) * 0.003 + (100 - totalHygiene) * 0.003 - (totalTeam * 0.002) + extraTrouble;
      // 疲労度が95を超えた当番がいると、1人につきハプニング発生率を15ポイント上げる。
      const exhaustedCount = assignedStudents.filter(s => (s.fatigue || 0) > 95).length;
      const fatigueTroubleBonus = exhaustedCount * 0.15;
      const isTrouble = Math.random() < Math.min(0.95, Math.max(0.05, baseTroubleChance + fatigueTroubleBonus));
      const troubleData = isTrouble ? AUTO_TROUBLES[Math.floor(Math.random() * AUTO_TROUBLES.length)] : null;
      const growthLogs = processStudentGrowth(assignedIds);
      gameState.currentSimResult = {
        speed: Math.min(100, Math.max(10, Math.round(totalSpeed))),
        neat: Math.min(100, Math.max(10, Math.round(totalNeat))),
        hygiene: Math.min(100, Math.max(10, Math.round(totalHygiene))),
        team: Math.min(100, Math.max(10, Math.round(totalTeam))),
        isTrouble, troubleData
      };
      gameState.lastGrowthLogs = growthLogs; render();
    }

    function renderSimulationPhase(container) {
      container.innerHTML = `<div class="text-center py-12 space-y-6"><div class="text-6xl animate-bounce">🍱</div><h2 class="text-2xl font-black text-amber-300 chalk-text">給食を配膳中...</h2><p class="text-emerald-200 text-sm">当番たちが経験を積みながら配膳しています...</p><div class="w-full bg-emerald-950 rounded-full h-5 overflow-hidden border border-emerald-600 max-w-md mx-auto shadow-inner"><div id="sim-progress" class="bg-amber-400 h-full w-0 transition-all duration-1000"></div></div></div>`;
      setTimeout(() => { const bar = document.getElementById("sim-progress"); if (bar) bar.style.width = "100%"; }, 100);
      setTimeout(() => { finishDaySimulation(); }, 1500);
    }

    function finishDaySimulation() {
      const res = gameState.currentSimResult;
      const dayBaseScore = Math.round((res.speed + res.neat + res.hygiene + res.team) / 4);
      // 評価点用のハプニング減点は従来どおり固定。満足度への影響だけを別計算する。
      let scoreTroublePenalty = 0;
      let satisfactionTroublePenalty = 0;
      if (res.isTrouble && res.troubleData) {
        scoreTroublePenalty = res.troubleData.penalty;
        // 満足度が70%以上なら従来どおり。低いほどハプニングによる満足度減少を弱める。
        const satisfactionBeforeTrouble = gameState.classSatisfaction;
        const penaltyScale = Math.max(0, Math.min(1, satisfactionBeforeTrouble / 70));
        satisfactionTroublePenalty = Math.round(res.troubleData.penalty * penaltyScale * 10) / 10;
        sfx.playAlert();
      }
      if (gameState.lastGrowthLogs.length > 0) sfx.playGrowth();
      res.appliedSatPenalty = satisfactionTroublePenalty;

      // 満足度の低下分は、満足度自体が低いほど小さくする。
      // 上昇分はそのまま反映し、0%付近でも回復できるようにする。
      const rawSatChange = (dayBaseScore - 50) * 0.35 + satisfactionTroublePenalty;
      const satChange = rawSatChange < 0
        ? rawSatChange * Math.max(0, Math.min(1, gameState.classSatisfaction / 70))
        : rawSatChange;
      gameState.classSatisfaction = Math.max(0, Math.min(100, gameState.classSatisfaction + satChange));

      const assignedIds = [gameState.dailyDuty.primary, gameState.dailyDuty.side1, gameState.dailyDuty.side2, gameState.dailyDuty.soup];
      // ハプニングが起きた日は、当番に参加した各生徒の契約期間内ハプニング回数を加算。
      if (res.isTrouble) {
        assignedIds.filter(id => id !== null && id !== undefined).forEach(id => {
          const contract = getContract(id);
          if (contract) contract.troubleCount = (contract.troubleCount || 0) + 1;
        });
      }
      processStudentFatigue(assignedIds);

      // チケットは週初めではなく、給食当番を終えるたびに毎日2枚補充。
      gameState.tickets += 2;
      gameState.totalDays += 1;
      gameState.activeContracts.forEach(c => { c.daysRemaining -= 1; });
      // 年間の当番回数を記録（同じ日に複数の担当枠へ入っていても1回として数える）。
      if (!gameState.yearDutyCounts || typeof gameState.yearDutyCounts !== "object") gameState.yearDutyCounts = {};
      [...new Set(assignedIds.filter(id => id !== null && id !== undefined))].forEach(id => {
        gameState.yearDutyCounts[id] = (gameState.yearDutyCounts[id] || 0) + 1;
      });
      // 42週目の最終登校日は、満足度が保たれていれば契約切れの生徒を無償で自動継続し、面談を発生させない。
      const isLastSchoolDay = gameState.week === 42 && gameState.dayIndex === 4;
      if (isLastSchoolDay && gameState.classSatisfaction >= 10) {
        gameState.activeContracts.filter(c => c.daysRemaining <= 0).forEach(c => {
          const student = getStudent(c.studentId);
          const weeks = Math.max(1, student && student.prefWeeks ? student.prefWeeks : (c.weeksTotal || 1));
          c.weeksTotal = weeks;
          c.daysRemaining = weeks * 5;
          c.costPaid = 0;
          c.troubleCount = 0;
          c.freeYearEndRenewal = true;
        });
      }
      const finalScore = Math.max(10, dayBaseScore + scoreTroublePenalty);
      gameState.weekLog.push({ day: MENU_SCHEDULE[gameState.dayIndex].day, score: finalScore, trouble: res.isTrouble, troubleName: res.isTrouble ? res.troubleData.title : null });
      gameState.yearScores.push(finalScore);
      gameState.visitingStudentsQueue = gameState.activeContracts.filter(c => c.daysRemaining <= 0);
      if (gameState.classSatisfaction < 10) {
        gameState.gameOverReason = `クラス満足度が${Math.round(gameState.classSatisfaction)}%まで低下したため、学級崩壊が発生しました。`;
        gameState.phase = "GAME_OVER";
      } else {
        gameState.phase = "DAY_RESULT";
      }
      render();
    }

    function renderDayResultPhase(container) {
      const res = gameState.currentSimResult;
      const lastLog = gameState.weekLog[gameState.weekLog.length - 1];
      const expiringCount = gameState.visitingStudentsQueue.length;
      const growthLogs = gameState.lastGrowthLogs;
      let html = `
        <div class="space-y-3 max-w-lg mx-auto text-center">
          <div class="bg-emerald-950/90 border border-emerald-500 p-4 rounded-2xl shadow-2xl">
            <h2 class="text-lg font-black text-amber-300 chalk-text mb-0.5">${MENU_SCHEDULE[gameState.dayIndex].day}の給食終了！</h2>
            <p class="text-[11px] text-emerald-200">配膳パフォーマンス結果</p>
            <div class="grid grid-cols-4 gap-1.5 my-3">
              <div class="bg-emerald-900/90 p-1.5 rounded border border-emerald-700"><span class="text-[9px] text-emerald-300 block">手際</span><span class="text-sm font-extrabold text-blue-300">${res.speed}点</span></div>
              <div class="bg-emerald-900/90 p-1.5 rounded border border-emerald-700"><span class="text-[9px] text-emerald-300 block">丁寧さ</span><span class="text-sm font-extrabold text-amber-300">${res.neat}点</span></div>
              <div class="bg-emerald-900/90 p-1.5 rounded border border-emerald-700"><span class="text-[9px] text-emerald-300 block">衛生</span><span class="text-sm font-extrabold text-emerald-300">${res.hygiene}点</span></div>
              <div class="bg-emerald-900/90 p-1.5 rounded border border-emerald-700"><span class="text-[9px] text-emerald-300 block">協調性</span><span class="text-sm font-extrabold text-indigo-300">${res.team}点</span></div>
            </div>
            ${growthLogs.length > 0 ? `<div class="p-2.5 bg-amber-950/90 border-2 border-amber-400 rounded-xl text-left text-xs mb-2.5 space-y-1 shadow"><div class="font-black text-amber-300 flex items-center gap-1"><span>📈</span> 当番経験により生徒が成長しました！</div>${growthLogs.map(g => `<p class="text-[11px] text-amber-100 font-bold">${g}</p>`).join('')}</div>` : `<div class="p-1.5 bg-emerald-900/60 rounded-xl text-[11px] text-emerald-300 border border-emerald-800 mb-2">🌱 本日は能力の上昇はありませんでした（伸び代の高い生徒ほど成長します）。</div>`}
            ${res.isTrouble ? `<div class="p-2.5 bg-rose-950/90 border-2 border-rose-500 rounded-xl text-left text-xs text-rose-100 mb-2 space-y-1"><div class="font-black text-rose-300 text-xs flex items-center gap-1"><span>⚠️</span> ハプニング発生: ${res.troubleData.title}</div><p class="text-[10px] text-rose-200">${res.troubleData.desc}</p><div class="text-amber-300 font-extrabold text-[11px]">📉 クラス満足度がダウン (${res.appliedSatPenalty ?? res.troubleData.penalty}pt)</div></div>` : ''}
            <div class="p-2 bg-emerald-900/80 rounded-xl text-xs text-emerald-100 border border-emerald-800">本日評価スコア: <strong class="text-amber-300 text-sm font-black">${lastLog.score}点</strong></div>
          </div>
          ${expiringCount > 0 ? `<div class="bg-amber-200 text-amber-950 p-2.5 rounded-xl border-2 border-amber-500 text-xs font-bold animate-bounce">🚪 契約最終日の生徒（${expiringCount}名）が職員室を訪ねています！</div><button onclick="proceedToRenewalVisits()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-900 font-black rounded-xl shadow-xl transition text-sm">職員室で契約更新面談を行う 🚪▶</button>` : `<button onclick="proceedNextDayOrWeek()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-900 font-black rounded-xl shadow-xl transition text-sm">${gameState.dayIndex < 4 ? '次の日へ進む ▶' : '1週間の総括を見る 🏆'}</button>`}
        </div>`;
      container.innerHTML = html;
    }

    function beginRenewalVisit(contract) {
      if (!contract) { proceedNextDayOrWeek(); return; }
      gameState.currentVisitingStudent = contract;
      const student = getStudent(contract.studentId);
      gameState.currentRenewalOffer = student ? createRenewalOffer(student) : null;
      gameState.phase = "RENEWAL_VISIT";
      render();
    }

    function proceedToRenewalVisits() {
      sfx.playSelect();
      beginRenewalVisit(gameState.visitingStudentsQueue.shift());
    }

    function proceedNextDayOrWeek() {
      sfx.playSelect();
      gameState.currentVisitingStudent = null;
      gameState.currentRenewalOffer = null;
      if (gameState.dayIndex < 4) { gameState.dayIndex++; gameState.phase = "DAILY_ASSIGN"; }
      else { sfx.playFanfare(); gameState.phase = "WEEK_RESULT"; }
      render();
    }

    function renderRenewalVisitPhase(container) {
      const activeVis = gameState.currentVisitingStudent;
      const student = activeVis ? getStudent(activeVis.studentId) : null;
      if (!student) { gameState.phase = "DAILY_ASSIGN"; render(); return; }
      const offer = gameState.currentRenewalOffer || (gameState.currentRenewalOffer = createRenewalOffer(student));
      const canAfford = gameState.tickets >= offer.cost;
      const potConfig = POTENTIAL_CONFIG[student.potential];
      let html = `
        <div class="bg-emerald-950/95 border-2 border-amber-400 p-4 rounded-2xl max-w-lg mx-auto space-y-3 shadow-2xl">
          <div class="flex items-center justify-between border-b border-emerald-700 pb-1.5"><span class="text-xs bg-amber-500 text-slate-900 px-2 py-0.5 rounded font-black">🚪 職員室での面談</span><span class="text-xs text-emerald-300">残り面談: ${gameState.visitingStudentsQueue.length + 1}人</span></div>
          <div class="text-center py-1 space-y-1"><div class="text-4xl animate-bounce">${student.icon}</div><h3 class="text-lg font-black text-amber-200">${student.name}「先生、契約更新の件ですが…」</h3><p class="text-xs text-emerald-200 italic">「僕/私の成長、見てくれましたか？次も頑張りますよ！」</p></div>
          <div class="notebook-card p-3 rounded-lg text-xs space-y-1.5">
            <div class="font-extrabold text-slate-800 border-b border-slate-300 pb-1 flex justify-between items-center"><span>📌 次期契約希望条件</span><span class="text-[10px] px-2 py-0.5 rounded font-black ${potConfig.badgeClass}">${potConfig.label}</span></div>
            <div class="flex justify-between items-center text-slate-700 text-[11px]"><span>希望期間: <strong class="text-emerald-700">${student.prefWeeks}週間</strong></span><span>必要おかわり券: <strong class="text-rose-700 font-extrabold">🎟️ ${offer.cost}枚</strong></span></div>
            <div class="grid grid-cols-4 gap-1 text-center font-bold text-[10px] pt-1"><div class="bg-blue-100 text-blue-800 p-1 rounded">手際:${student.speed}</div><div class="bg-amber-100 text-amber-800 p-1 rounded">丁寧:${student.neat}</div><div class="bg-emerald-100 text-emerald-800 p-1 rounded">衛生:${student.hygiene}</div><div class="bg-indigo-100 text-indigo-800 p-1 rounded">協調:${student.team}</div></div>
            <div class="mt-2 text-center font-extrabold ${student.fatigue >= 75 ? 'text-rose-700' : student.fatigue >= 45 ? 'text-amber-700' : 'text-emerald-700'}">😮‍💨 現在の疲労度: ${student.fatigue || 0}/100</div>
            <div class="mt-1 text-center font-extrabold text-rose-700">⚠️ 今回の契約期間中のハプニング回数: ${activeVis.troubleCount || 0}回</div>
          </div>
          <div class="space-y-2 pt-1">
            <button onclick="renewContractChoice(${student.id}, ${student.prefWeeks}, ${offer.cost})" ${!canAfford ? 'disabled' : ''} class="w-full py-2.5 ${!canAfford ? 'bg-slate-600 text-slate-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg'} font-black rounded-xl text-xs sm:text-sm transition">${!canAfford ? `チケット不足 (要🎟️${offer.cost})` : `🤝 契約更新する (🎟️${offer.cost}枚消費 / ${student.prefWeeks}週間)`}</button>
            <button onclick="releaseContractChoice(${student.id})" class="w-full py-2 bg-rose-700 hover:bg-rose-600 text-white font-black rounded-xl text-xs sm:text-sm transition shadow">👋 契約終了・戦力外（枠を開ける）</button>
          </div>
        </div>`;
      container.innerHTML = html;
    }

    function renewContractChoice(studentId, weeks, cost) {
      if (gameState.tickets < cost) { sfx.playAlert(); return; }
      sfx.playSuccess(); gameState.tickets -= cost;
      removeContract(studentId); addContract(studentId, weeks, cost);
      nextVisitOrResume();
    }

    function releaseContractChoice(studentId) { sfx.playSelect(); putStudentOnScoutCooldown(studentId); removeContract(studentId); nextVisitOrResume(); }

    function nextVisitOrResume() {
      gameState.currentVisitingStudent = null; gameState.currentRenewalOffer = null;
      if (gameState.visitingStudentsQueue.length > 0) beginRenewalVisit(gameState.visitingStudentsQueue.shift());
      else proceedNextDayOrWeek();
    }

    function renderWeekResultPhase(container) {
      const avgScore = Math.round(gameState.weekLog.reduce((acc, l) => acc + l.score, 0) / 5);
      let rank = "C", rankColor = "text-slate-400";
      if (avgScore >= 75) { rank = "S"; rankColor = "text-yellow-400"; }
      else if (avgScore >= 62) { rank = "A"; rankColor = "text-rose-400"; }
      else if (avgScore >= 50) { rank = "B"; rankColor = "text-blue-400"; }
      const termLabel = gameState.week <= 15 ? "1学期" : gameState.week <= 32 ? "2学期" : "3学期";
      const breakAfterWeek = gameState.week === 15 ? "夏休み" : gameState.week === 32 ? "冬休み" : "";
      const isFinalWeek = gameState.week >= 42;
      let html = `
        <div class="space-y-4 max-w-xl mx-auto text-center"><div class="bg-emerald-950/95 border-2 border-amber-400 p-5 rounded-2xl shadow-2xl">
          <span class="text-xs text-amber-300 font-bold uppercase tracking-widest">${termLabel}・第${gameState.week}週 / 全42週</span><h2 class="text-xl font-black text-amber-200 chalk-text mt-0.5">今週の給食当番 総合評価</h2>
          <div class="my-5 flex justify-center items-center gap-8"><div><span class="text-xs text-emerald-300 block">週間平均スコア</span><span class="text-3xl font-black text-white">${avgScore}点</span></div><div class="h-12 w-px bg-emerald-700"></div><div><span class="text-xs text-emerald-300 block">クラス評価</span><span class="text-6xl font-black ${rankColor}">${rank}</span></div></div>
          <div class="space-y-1 text-left text-xs bg-emerald-900/80 p-3 rounded-xl border border-emerald-800 mb-3">`;
      gameState.weekLog.forEach(l => { html += `<div class="flex justify-between items-center text-emerald-200"><span>${l.day}:</span><span class="font-bold text-amber-300">${l.score}点 (${l.trouble ? `⚠️${l.troubleName}` : 'スムーズ'})</span></div>`; });
      html += `</div><p class="text-xs text-emerald-200 italic">${rank === 'S' ? '素晴らしい指導力！生徒たちの伸び代が開花し、最強チームができつつあります！' : rank === 'A' ? '見事な育成手腕です！当番経験によって順調に能力が引き出されています。' : '伸び代の高い生徒(S/Aランク)を中心に育成し、次週のスコア向上を目指しましょう！'}</p></div>
          <button onclick="${isFinalWeek ? 'finishSchoolYear()' : 'startNextWeek()'}" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-900 font-black rounded-xl shadow-xl text-base transition">${isFinalWeek ? '🏁 1年を終了して年間成績を見る' : breakAfterWeek ? `${breakAfterWeek}に入る 🌴` : '次の週へ進む 🚀'}</button>
        </div>`;
      container.innerHTML = html;
    }

    function applySchoolBreakGrowth(type) {
      const summer = type === "夏休み";
      const logs = [];
      const statNames = { speed: "手際", neat: "丁寧さ", hygiene: "衛生", team: "協調性" };
      gameState.students.forEach(student => {
        // 夏休みは成長しやすく、伸び幅も大きい。冬休みは控えめ。
        const chance = summer ? ({ S: 0.90, A: 0.78, B: 0.62, C: 0.45 }[student.potential] || 0.45)
                              : ({ S: 0.65, A: 0.52, B: 0.38, C: 0.25 }[student.potential] || 0.25);
        if (Math.random() >= chance) return;
        const stats = ["speed", "neat", "hygiene", "team"].filter(key => student[key] < 100);
        if (!stats.length) return;
        const key = stats[Math.floor(Math.random() * stats.length)];
        const amount = summer ? (Math.floor(Math.random() * 6) + 2) : (Math.floor(Math.random() * 3) + 1);
        const oldValue = student[key];
        student[key] = Math.min(100, oldValue + amount);
        const actualGain = student[key] - oldValue;
        if (actualGain > 0) logs.push(`${student.icon} ${student.name}：${statNames[key]} +${actualGain}（現在 ${student[key]}）`);
      });
      gameState.breakType = type;
      gameState.breakGrowthLogs = logs;
    }

    function startNextWeek() {
      sfx.playSuccess();
      const completedWeek = gameState.week;
      gameState.week++; gameState.dayIndex = 0;
      // 夏休み（1学期終了後）・冬休み（2学期終了後）に全生徒の成長判定。
      if (completedWeek === 15 || completedWeek === 32) {
        applySchoolBreakGrowth(completedWeek === 15 ? "夏休み" : "冬休み");
        gameState.phase = "BREAK_RESULT";
      } else {
        gameState.weekLog = []; gameState.phase = "DAILY_ASSIGN";
      }
      render();
    }

    function renderBreakResultPhase(container) {
      const isSummer = gameState.breakType === "夏休み";
      const logs = gameState.breakGrowthLogs || [];
      container.innerHTML = `<div class="max-w-xl mx-auto bg-emerald-950/95 border-2 border-amber-400 p-5 rounded-2xl shadow-2xl text-center space-y-4">
        <div class="text-5xl">${isSummer ? "🌻" : "❄️"}</div>
        <h2 class="text-2xl font-black text-amber-200">${gameState.breakType}が終わりました！</h2>
        <p class="text-sm text-emerald-100">${isSummer ? "夏休みは長い休みを利用して、生徒たちが大きく成長しました。" : "冬休みを過ごし、生徒たちが少し成長しました。"}</p>
        <div class="rounded-xl bg-emerald-900/80 border border-emerald-700 p-3 text-left space-y-1 max-h-64 overflow-y-auto">
          ${logs.length ? logs.map(line => `<p class="text-xs text-amber-100">📈 ${line}</p>`).join("") : '<p class="text-sm text-emerald-200 text-center">今回は能力が上がった生徒はいませんでした。</p>'}
        </div>
        <p class="text-xs text-emerald-300">成長した生徒：${logs.length}人</p>
        <button onclick="continueAfterBreak()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-900 font-black rounded-xl">${gameState.week}週目（${gameState.week <= 32 ? "2学期" : "3学期"}）を始める ▶</button>
      </div>`;
    }

    function continueAfterBreak() {
      sfx.playSelect(); gameState.weekLog = []; gameState.phase = "DAILY_ASSIGN"; render();
    }

    function finishSchoolYear() {
      sfx.playFanfare();
      // 年間210日を完走した場合だけ、当番回数最多の生徒から感謝の言葉を贈る。
      if (gameState.week === 42 && gameState.dayIndex === 4 && gameState.totalDays >= 210) {
        const counts = gameState.yearDutyCounts || {};
        const eligible = (gameState.students || []).map(student => ({ student, count: Number(counts[student.id] || 0) }))
          .sort((a, b) => b.count - a.count || a.student.id - b.student.id);
        gameState.farewellStudentId = eligible.length && eligible[0].count > 0 ? eligible[0].student.id : null;
        gameState.phase = gameState.farewellStudentId ? "FAREWELL" : "YEAR_END";
      } else {
        gameState.phase = "YEAR_END";
      }
      render();
    }

    function renderFarewellPhase(container) {
      const student = getStudent(gameState.farewellStudentId);
      if (!student) { gameState.phase = "YEAR_END"; render(); return; }
      const count = (gameState.yearDutyCounts || {})[student.id] || 0;
      container.innerHTML = `<style>
        @keyframes farewellFadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .farewell-line { opacity: 0; animation: farewellFadeIn 2.4s ease-out forwards; }
        .farewell-line.delay-1 { animation-delay: 1.8s; }
        .farewell-line.delay-2 { animation-delay: 4.0s; }
      </style>
      <div class="max-w-xl mx-auto min-h-[55vh] flex flex-col items-center justify-center text-center space-y-6 py-10">
        <div class="text-6xl farewell-line">💌</div>
        <div class="farewell-line delay-1 space-y-4">
          <div class="text-5xl">${student.icon}</div>
          <h2 class="text-2xl sm:text-3xl font-black text-amber-200 chalk-text">${student.name}からのメッセージ</h2>
          <p class="text-xs text-emerald-300">1年間で最も多く給食当番を担当した生徒（${count}回）</p>
        </div>
        <p class="farewell-line delay-2 text-lg sm:text-xl leading-loose font-bold text-white px-3">みんなと一緒に食べた給食の時間がだいすきでした！先生、今までありがとうございました。<br><span class="block mt-4 text-amber-300">　${student.name}</span></p>
        <button onclick="showYearEndAfterFarewell()" class="mt-4 px-6 py-3 bg-amber-500 hover:bg-amber-400 text-slate-900 font-black rounded-xl shadow-xl">1年の結果を見る 🏆</button>
      </div>`;
    }

    function showYearEndAfterFarewell() {
      sfx.playFanfare(); gameState.phase = "YEAR_END"; render();
    }

    function renderYearEndPhase(container) {
      const scores = gameState.yearScores || [];
      const maxScore = scores.length ? Math.max(...scores) : 0;
      const minScore = scores.length ? Math.min(...scores) : 0;
      const avgScore = scores.length ? (scores.reduce((sum, score) => sum + score, 0) / scores.length) : 0;
      container.innerHTML = `<div class="max-w-xl mx-auto bg-emerald-950/95 border-2 border-amber-400 p-6 rounded-2xl shadow-2xl text-center space-y-5">
        <div class="text-6xl">🏆</div><p class="text-xs uppercase tracking-widest text-amber-300 font-bold">School Year Complete</p>
        <h2 class="text-3xl font-black text-amber-200">1年間お疲れさま！</h2>
        <p class="text-sm text-emerald-100">全42週・${scores.length}日間の給食当番が終了しました。</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="bg-emerald-900/80 border border-amber-500 rounded-xl p-4"><p class="text-xs text-emerald-200">最高評価点</p><p class="text-3xl font-black text-amber-300">${maxScore}<span class="text-sm">点</span></p></div>
          <div class="bg-emerald-900/80 border border-rose-500 rounded-xl p-4"><p class="text-xs text-emerald-200">最低評価点</p><p class="text-3xl font-black text-rose-300">${minScore}<span class="text-sm">点</span></p></div>
          <div class="bg-emerald-900/80 border border-blue-500 rounded-xl p-4"><p class="text-xs text-emerald-200">平均評価点</p><p class="text-3xl font-black text-blue-300">${avgScore.toFixed(1)}<span class="text-sm">点</span></p></div>
        </div>
        <p class="text-xs text-emerald-300">集計対象：1年間の全給食日の評価点（ハプニングによる減点を含む）</p>
        <button onclick="initGame()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-900 font-black rounded-xl">もう一度プレイ ↻</button>
      </div>`;
    }

    window.onload = () => { render(); };
  </script>
</body>
</html>
